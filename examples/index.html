<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spindle — 360° examples</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font: 15px/1.5 system-ui, sans-serif;
        background: #0e1014;
        color: #e6e8ec;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 24px;
      }
      h1 { margin: 0; font-size: 22px; font-weight: 600; }
      h2 { margin: 24px 0 0; font-size: 16px; font-weight: 600; }
      p { margin: 0; color: #9aa0a6; }
      .viewer {
        width: min(880px, 92vw);
        aspect-ratio: 16 / 9;
        background: #16191f;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      }
      .viewer.product { aspect-ratio: 4 / 3; }
      .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      button {
        background: #1f6feb;
        border: none;
        color: #fff;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
      }
      button.ghost { background: #2a2f37; }
      progress { width: 160px; }
      .credit { font-size: 12px; }
      a { color: #1f6feb; }
    </style>
  </head>
  <body>
    <h1>spindle</h1>
    <p>Drag to orbit · scroll / double-tap to zoom · autoplay until grab.</p>

    <h2>Aerial orbit</h2>
    <div id="aerial" class="viewer"></div>
    <div class="bar">
      <button data-play="aerial">play</button>
      <button data-stop="aerial" class="ghost">stop</button>
      <button data-fs="aerial" class="ghost">fullscreen</button>
      <progress id="aerial-prog" max="1" value="0"></progress>
      <span id="aerial-status">loading…</span>
    </div>
    <p class="credit">
      Aerial flyover of ЖК Avalon Holiday, courtesy of
      <a href="https://lun.ua/uk/%D0%B6%D0%BA-avalon-holiday-%D1%81%D0%BE%D0%BA%D1%96%D0%BB%D1%8C%D0%BD%D0%B8%D0%BA%D0%B8/%D0%B0%D0%B5%D1%80%D0%BE%D0%BE%D0%B1%D0%BB%D1%96%D1%82">lun.ua</a>.
      Demonstration only.
    </p>

    <h2>Product spin</h2>
    <div id="product" class="viewer product"></div>
    <div class="bar">
      <button data-play="product">play</button>
      <button data-stop="product" class="ghost">stop</button>
      <button data-fs="product" class="ghost">fullscreen</button>
      <progress id="product-prog" max="1" value="0"></progress>
      <span id="product-status">loading…</span>
    </div>
    <p class="credit">Generic product turntable, source unknown. Demonstration only.</p>

    <script type="module">
      import { Spindle } from '../src/index.ts'

      function makeViewer(id, dir, ext, count, fps) {
        const prog = document.getElementById(`${id}-prog`)
        const status = document.getElementById(`${id}-status`)
        const source = Array.from({ length: count }, (_, i) => `frames/${dir}/${i + 1}.${ext}`)
        return new Spindle(`#${id}`, {
          source,
          autoplay: true,
          autoplayFps: fps,
          loop: true,
          momentum: true,
          zoom: true,
          fullscreen: true,
          onProgress: (p) => {
            prog.value = p
            status.textContent = `loading ${Math.round(p * 100)}%`
          },
          onReady: () => (status.textContent = 'ready'),
        })
      }

      const viewers = {
        aerial: makeViewer('aerial', 'aerial', 'jpg', 36, 3),
        product: makeViewer('product', 'product', 'png', 52, 4),
      }

      document.querySelectorAll('[data-play]').forEach((b) =>
        (b.onclick = () => viewers[b.dataset.play].play()))
      document.querySelectorAll('[data-stop]').forEach((b) =>
        (b.onclick = () => viewers[b.dataset.stop].stop()))
      document.querySelectorAll('[data-fs]').forEach((b) =>
        (b.onclick = () => viewers[b.dataset.fs].fullscreen()))

      window.viewers = viewers
    </script>
  </body>
</html>
